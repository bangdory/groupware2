<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>자유게시판</title>
    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/assets/vendor/simple-datatables/style.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
</head>

<body>
<!-- ======= Header ======= -->
<header id="header" class="header fixed-top d-flex align-items-center" th:insert="~{/designTemplates/header :: header}">
</header>
<!-- End Header -->

<!-- ======= Sidebar ======= -->
<aside id="sidebar" class="sidebar" th:insert="~{/designTemplates/aside :: aside}">
</aside>
<!-- End Sidebar-->

<main id="main" class="main">
    <div class="pagetitle">
        <h1>자유게시판</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index">Home</a></li>
                <li class="breadcrumb-item active">자유게시판</li>
            </ol>
        </nav>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">게시글 목록</h5>

                <!-- 게시글 생성 버튼 추가 -->
                <div class="d-flex justify-content-end">
                    <a href="/posts/createPage" class="btn btn-primary">게시글 생성</a>
                </div>

                <!-- Table with stripped rows -->
                <table class="table datatable mt-3">
                    <thead>
                    <tr>
                        <th scope="col">번호</th>
                        <th scope="col">제목</th>
                        <th scope="col">작성자</th>
                        <th scope="col">작성일</th>
                        <th scope="col">조회수</th>
                    </tr>
                    </thead>
                    <tbody id="post-list">
                    <!-- 게시글 목록이 여기에 들어감 -->
                    </tbody>
                </table>
                <!-- End Table with stripped rows -->
            </div>
        </div>
    </section>
</main>

<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/simple-datatables/simple-datatables.js"></script>
<script src="/assets/js/main.js"></script>

<script>
    // 게시글 목록 가져오기
    fetch('/posts')
        .then(response => response.json())
        .then(posts => {
            const postList = document.getElementById('post-list');
            posts.forEach((post, index) => {
                const row = `<tr>
                                <td>${post.postNo}</td>
                                <td><a href="/posts/detailPage?postNo=${post.postNo}">${post.postTitle}</a></td>
                                <td>${post.empName}</td>
                                <td>${post.postDate}</td>
                                <td>${post.postView}</td>
                            </tr>`;
                postList.innerHTML += row;
            });
        })
        .catch(error => console.error('Error fetching posts:', error));
</script>

</body>

</html>
