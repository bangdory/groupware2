<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>게시글 상세 정보</title>
    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
</head>

<body>
<!-- ======= Header ======= -->
<header id="header" class="header fixed-top d-flex align-items-center" th:insert="~{/designTemplates/header :: header}">
</header>
<!-- End Header -->

<!-- ======= Sidebar ======= -->
<aside id="sidebar" class="sidebar" th:insert="~{/designTemplates/aside :: aside}">
</aside>
<!-- End Sidebar-->

<!-- ======= Main Section ======= -->
<main id="main" class="main">
    <div class="pagetitle">
        <h1>게시글 상세 정보</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index">Home</a></li>
                <li class="breadcrumb-item"><a href="/posts/list">자유게시판</a></li>
                <li class="breadcrumb-item active">게시글 상세 정보</li>
            </ol>
        </nav>
    </div>

    <section class="section">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title" id="postTitle">게시글 제목</h5>
                <p id="postContent">게시글 내용</p>
                <div class="d-flex justify-content-between">
                    <span id="postDate">작성일</span>
                    <span id="postView">조회수: 0</span>
                </div>
            </div>
        </div>

        <!-- 파일 섹션 -->
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">첨부 파일</h5>
                <ul id="file-list" class="list-group"></ul>
            </div>
        </div>

        <!-- 댓글 섹션 -->
        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">댓글</h5>

                <!-- 댓글 목록 -->
                <ul id="comment-list" class="list-group"></ul>

                <!-- 댓글 작성 -->
                <form id="comment-form" class="mt-3">
                    <div class="mb-3">
                        <label for="commentContent" class="form-label">댓글 작성</label>
                        <textarea class="form-control" id="commentContent" rows="3" placeholder="댓글을 입력하세요" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">댓글 작성</button>
                </form>
            </div>
        </div>
    </section>
</main>

<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/main.js"></script>

<script>
    function getEmpNoFromToken() {
        const token = localStorage.getItem('accessToken'); // JWT 토큰을 가져옴
        if (!token) return null;

        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        const tokenData = JSON.parse(jsonPayload);
        return tokenData.sub; // emp_no 값
    }

    function getCurrentDate() {
        const today = new Date();
        const year = today.getFullYear();
        const month = ('0' + (today.getMonth() + 1)).slice(-2); // 두 자리 수로 포맷
        const day = ('0' + today.getDate()).slice(-2);
        return `${year}-${month}-${day}`;
    }

    const postNo = new URLSearchParams(window.location.search).get('postNo');
    const empNo = getEmpNoFromToken(); // Use your JWT method to get empNo

    // Fetch post details
    fetch(`/posts/${postNo}`)
        .then(response => response.json())
        .then(post => {
            document.getElementById('postTitle').innerText = post.postTitle;
            document.getElementById('postContent').innerText = post.postContent;
            document.getElementById('postDate').innerText = `작성일: ${post.postDate}`;
            document.getElementById('postView').innerText = `조회수: ${post.postView}`;
        })
        .catch(error => console.error('Error fetching post details:', error));

    // Fetch files for the post
    function loadFiles() {
        fetch(`/files/post/${postNo}`)
            .then(response => response.json())
            .then(files => {
                const fileList = document.getElementById('file-list');
                fileList.innerHTML = ''; // Clear previous files
                files.forEach(file => {
                    const listItem = document.createElement('li');
                    listItem.classList.add('list-group-item');
                    listItem.innerHTML = `<a href="/uploads/${file.fileName}">${file.originalFilename}</a>`;
                    fileList.appendChild(listItem);
                });
            })
            .catch(error => console.error('Error fetching files:', error));
    }

    loadFiles();

    // Fetch comments for the post
    function loadComments() {
        fetch(`/comments/post/${postNo}/top-level`)
            .then(response => response.json())
            .then(comments => {
                const commentList = document.getElementById('comment-list');
                commentList.innerHTML = ''; // Clear previous comments
                comments.forEach(comment => {
                    const listItem = createCommentItem(comment);
                    commentList.appendChild(listItem);
                });
            })
            .catch(error => console.error('Error fetching comments:', error));
    }

    loadComments();

    // Create comment HTML
    function createCommentItem(comment) {
        const listItem = document.createElement('li');
        listItem.classList.add('list-group-item');
        listItem.innerHTML = `
            <strong>${comment.empName}</strong> <small>${comment.commentDate}</small>
            <p>${comment.commentContent}</p>
            <button class="btn btn-sm btn-link reply-btn" data-id="${comment.commentNo}">답글 달기</button>
            <button class="btn btn-sm btn-danger delete-btn" data-id="${comment.commentNo}">삭제</button>
            <ul class="list-group mt-2 reply-list" id="reply-list-${comment.commentNo}"></ul>
        `;

        // Load replies for this comment
        loadReplies(comment.commentNo);

        // Add event listener for reply button
        listItem.querySelector('.reply-btn').addEventListener('click', function () {
            const replyContent = prompt('답글을 입력하세요:');
            if (replyContent) {
                createReply(comment.commentNo, replyContent);
            }
        });

        // Add event listener for delete button
        listItem.querySelector('.delete-btn').addEventListener('click', function () {
            if (confirm('이 댓글을 삭제하시겠습니까?')) {
                deleteComment(comment.commentNo);
            }
        });

        return listItem;
    }

    // Load replies for a comment
    function loadReplies(commentNo) {
        fetch(`/comments/replies/${commentNo}`)
            .then(response => response.json())
            .then(replies => {
                const replyList = document.getElementById(`reply-list-${commentNo}`);
                replies.forEach(reply => {
                    const replyItem = document.createElement('li');
                    replyItem.classList.add('list-group-item');
                    replyItem.innerHTML = `
                        <strong>${reply.empName}</strong> <small>${reply.commentDate}</small>
                        <p>${reply.commentContent}</p>
                        <button class="btn btn-sm btn-danger delete-reply-btn" data-id="${reply.commentNo}">삭제</button>
                    `;
                    replyList.appendChild(replyItem);

                    // Add event listener for delete button for reply
                    replyItem.querySelector('.delete-reply-btn').addEventListener('click', function () {
                        if (confirm('이 답글을 삭제하시겠습니까?')) {
                            deleteComment(reply.commentNo);
                        }
                    });
                });
            })
            .catch(error => console.error('Error fetching replies:', error));
    }

    // 댓글 작성
    document.getElementById('comment-form').addEventListener('submit', function (event) {
        event.preventDefault();
        const commentContent = document.getElementById('commentContent').value;

        const commentData = {
            postNo: parseInt(postNo),
            empNo: empNo,
            commentContent: commentContent,
            commentParent: 0, // 0 indicates top-level comment
            commentStep: 0,
            commentRef: postNo, // Use postNo as the initial ref for top-level comments
            commentRefOrder: 0, // Initial order for top-level comments
            commentAnswernum: 0,
            commentDate:getCurrentDate(),
            commentState: true
        };

        // Create comment
        fetch('/comments', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(commentData)
        })
            .then(response => response.json())
            .then(() => {
                document.getElementById('commentContent').value = ''; // Clear input
                loadComments(); // Reload comments after adding
            })
            .catch(error => console.error('Error creating comment:', error));
    });

    // 답글 작성
    function createReply(parentCommentId, replyContent) {
        const replyData = {
            postNo: parseInt(postNo),
            empNo: empNo,
            commentContent: replyContent,
            commentParent: parentCommentId,
            commentStep: 1, // Indicates it's a reply
            commentRef: parentCommentId,
            commentRefOrder: 0, // Placeholder for now
            commentAnswernum: 0,
            commentDate:getCurrentDate(),
            commentState: true
        };

        // Create reply
        fetch('/comments', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(replyData)
        })
            .then(response => response.json())
            .then(() => {
                loadComments(); // Reload comments after adding reply
            })
            .catch(error => console.error('Error creating reply:', error));
    }

    // 댓글 삭제
    function deleteComment(commentNo) {
        fetch(`/comments/${commentNo}`, {
            method: 'DELETE',
        })
            .then(() => {
                loadComments(); // Reload comments after deletion
            })
            .catch(error => console.error('Error deleting comment:', error));
    }
</script>

</body>

</html>
