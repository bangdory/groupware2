<main id="main" class="main">

    <div class="pagetitle">
        <h1>직원근태관리</h1>
        <nav>
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/index">Home</a> <span> > </span><a href="/admin/employeeList">직원근태관리</a></li>
            </ol>
        </nav>
    </div><!-- End Page Title -->

    <section class="section dashboard">
        <div class="row">

            <!-- Left side columns -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header">
                        <h3>출근/퇴근 시간 변경</h3>
<!--                        <h3 th:text="${empEntity.empName}"></h3>-->
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                            <tr>
                                <th>근무일</th>
                                <th>출근 시간</th>
                                <th>퇴근 시간</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="attEntity : ${attEntity}">
                                <td th:text="${attEntity.regDate}"></td>
                                <td>
                                    <div style="display: flex; align-items: center;">
                                        <input style="width: 80%" type="text" class="form-control" th:value="${attEntity.arrTime}" id="startTime" readonly>
                                        <button type="button" class="btn btn-sm btn-primary ms-2"
                                                th:attr="data-attNo=${attEntity.attNo}"
                                                th:onclick="|editStartTime(this)|">
                                            수정
                                        </button>
                                    </div>
                                </td>

                                <td>
                                    <div style="display: flex; align-items: center;">
                                        <input style="width: 80%;" type="text" class="form-control" th:value="${attEntity.levTime}" id="endTime" readonly>
                                        <button type="button" class="btn btn-sm btn-primary ms-2"
                                                th:attr="data-attNo=${attEntity.attNo}"
                                                th:onclick="|editEndTime(this)|">
                                            수정
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            </tbody>

                        </table>
                    </div>
                </div>
            </div>
            <!-- End Left side columns -->

            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <h3>신청된 휴가 내역</h3>
                    </div>
                    <div class="card-body">
                        <p>신청된 날짜: <span th:text="${vacEntity.reqDate}"></span></p>
                        <p>휴가 기간: <span th:text="${vacEntity.startDate}"></span> ~ <span th:text="${vacEntity.endDate}"></span></p>
                    </div>
                    <div class="card-footer d-flex justify-content-end">
                        <div th:if="${vacEntity.approveBoolean == 0}">
                            <button type="button" class="btn btn-success"
                                    th:attr="data-vacNo=${vacEntity.vacNo}, data-approve='true'"
                                    th:onclick="|approve(this)|">승인</button>
                            <button type="button" class="btn btn-danger ms-2"
                                    th:attr="data-vacNo=${vacEntity.vacNo}, data-approve='false'"
                                    th:onclick="|approve(this)|">거절</button>
                        </div>

                        <div th:if="${vacEntity.approveBoolean == 1}">
                            <button type="button" class="btn btn-secondary" disabled>처리 완료</button>
                        </div>
                    </div>

                </div>
            </div>


        </div>
    </section>


</main><!-- End #main -->

<!-- Template Main JS File -->
<script src="/assets/js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {

        // localStorage 에서 jwt 가져오기
        const jwtToken = localStorage.getItem("accessToken");

        if (jwtToken) {
            console.log('jwtToken: ' + jwtToken);

            // jwt 토큰을 decoding 해서 json 타입으로 리턴 받기
            const tokenData = decodingJwt(jwtToken);

            if (tokenData) {

                const empNo = tokenData.sub;
                const auth = tokenData.auth;
                console.log('empNo: ' + empNo);
                console.log('auth: '+ auth)

                // bsLink 의 클래스를 가진 요소 가져오기
                const aTags = document.querySelectorAll('a.bsLink');


                // 각 aTag 요소에 대해 처리
                aTags.forEach(function(aTag) {
                    if (aTag && empNo) {
                        // bsLink 클래스의 href 속성 가져오기
                        const originalHref = aTag.href;
                        // 기존 링크에 empNo 데이터 추가하기
                        aTag.href = originalHref + '?empNo=' + empNo;
                        console.log('Updated aTag.href: ' + aTag.href);
                    }
                });
                checkAdmin(auth);


            } else {
                console.error("JWT 토큰에서 empNo 데이터를 찾을 수 없습니다.");
            }

        } else {
            console.error("JWT 토큰을 찾을 수 없습니다.");
        }
    });

    function decodingJwt(token) {
        try {
            // 토큰의 페이로드 부분(Base64로 인코딩된 부분)을 디코딩
            const base64Url = token.split('.')[1]; // JWT의 두 번째 부분이 페이로드
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload); // JSON 형식으로 변환하여 반환
        } catch (e) {
            console.error('JWT 파싱 에러:', e);
            return null; // 에러 발생 시 null 반환
        }
    }

    function checkAdmin(auth) {
        const adminMenu = document.getElementById('adminMenu');
        if (auth === 'ADMIN'){
            adminMenu.style.display = 'block';
        } else {
            adminMenu.style.display = 'none';
        }
    }

    function editStartTime(buttonElement) {
        const attNo = buttonElement.getAttribute('data-attNo');

        const newHour = prompt("새로운 출근 시간을 입력하세요 (시):", "");
        const newMinute = prompt("새로운 출근 시간을 입력하세요 (분):", "");

        if (newHour && newMinute) {
            // POST로 서버에 출근 시간을 전송하는 예시 (AJAX 사용)
            const data = {
                attNo: attNo,
                hour: newHour,
                minute: newMinute
            };

            fetch('/edit/editStartTime', { // 서버 API 경로로 대체
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
                .then(response => response.json())
                .then(result => {
                    alert("출근 시간이 성공적으로 업데이트되었습니다.");
                    document.getElementById('startTime').value = result.arrTime;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("출근 시간 업데이트에 실패했습니다.");
                });
        } else {
            alert("시간과 분을 모두 입력해주세요.");
        }
    }

    function editEndTime(buttonElement) {
        const attNo = buttonElement.getAttribute('data-attNo');

        const newHour = prompt("새로운 퇴근 시간을 입력하세요 (시):", "");
        const newMinute = prompt("새로운 퇴근 시간을 입력하세요 (분):", "");

        if (newHour && newMinute) {
            // POST로 서버에 퇴근 시간을 전송하는 예시 (AJAX 사용)
            const data = {
                attNo: attNo,
                hour: newHour,
                minute: newMinute
            };

            fetch('/edit/editEndTime', { // 서버 API 경로로 대체
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
                .then(response => response.json())
                .then(result => {
                    alert("퇴근 시간이 성공적으로 업데이트되었습니다.");
                    document.getElementById('endTime').value = result.levTime;
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert("퇴근 시간 업데이트에 실패했습니다.");
                });
        } else {
            alert("시간과 분을 모두 입력해주세요.");
        }
    }

    function approve(buttonElement) {
        // 버튼의 data-vacNo와 data-approve 속성 값을 가져옴
        const vacNo = buttonElement.getAttribute('data-vacNo');
        const approveValue = buttonElement.getAttribute('data-approve');

        // data-approve 값에 따라 approve 변수를 설정
        const approve = (approveValue === 'true') ? 1 : 2;

        console.log(approve);

        // 서버로 보낼 데이터
        const data = {
            vacNo: vacNo,
            approve: approve
        };

        // POST 요청으로 데이터 전송
        fetch('/edit/approve', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
        })
            .then(response => response.json())
            .then(result => {
                // 성공 메시지 처리
                alert("승인 상태가 성공적으로 업데이트되었습니다.");
                // 버튼들을 모두 찾음
                const cardFooter = buttonElement.closest('.card-footer');
                const buttons = cardFooter.querySelectorAll('button');

                // 기존 버튼을 숨김
                buttons.forEach(btn => btn.style.display = 'none');

                // 새로운 버튼 생성
                const completedButton = document.createElement('button');
                completedButton.type = 'button';
                completedButton.className = 'btn btn-secondary';
                completedButton.disabled = true; // 비활성화
                completedButton.innerText = '처리 완료';

                // cardFooter에 새로운 버튼 추가
                cardFooter.appendChild(completedButton);
            })
            .catch(error => {
                console.error('Error:', error);
                alert("승인 상태 업데이트에 실패했습니다.");
            });
    }



</script>
